name: Release ckb-whitehat

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for manual runs)
        required: true
        type: string

# Write access is scoped to the publish job only: the build jobs compile and
# test, and must not hold the ability to create a release (audit M2.4). A
# compromised/PR-injected build step can no longer push release assets.
permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          EVENT_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="$EVENT_TAG"
          if [ -z "$tag" ] || [ "$tag" = main ] || [ "$tag" = master ]; then tag="$INPUT_TAG"; fi
          if [ -z "$tag" ]; then tag="dev"; fi
          tag="${tag#v}"
          ext=""
          if [ "$GOOS" = windows ]; then ext=.exe; fi
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X main.version=$tag" -o "dist/ckb-whitehat-${GOOS}-${GOARCH}${ext}" ./cmd/ckb-whitehat
      - uses: actions/upload-artifact@v4
        with:
          name: ckb-whitehat-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  publish:
    name: Publish release assets
    needs: build
    runs-on: ubuntu-latest
    # Only the publish job writes a release; the build jobs above stay read-only.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: ckb-whitehat-*
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum ckb-whitehat-* > sha256sums.txt
      - name: Resolve tag
        id: tag
        env:
          EVENT_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$EVENT_TAG" ] && [ "$EVENT_TAG" != "master" ] && [ "$EVENT_TAG" != "main" ]; then
            echo "tag=$EVENT_TAG" >> "$GITHUB_OUTPUT"
          elif [ -n "$INPUT_TAG" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=manual-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: dist/*
